services:
  license-server:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8321:8321"
    # No depends_on needed if using external DB, or user can add if they put them in same compose
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - PYTHONUNBUFFERED=1
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-license-server@automationtester.in}
      - BASE_URL=${BASE_URL:-http://localhost:8321}
      - MULTI_TENANT_MODE=${MULTI_TENANT_MODE:-False}
    networks:
      - routellm_default
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src:delegated
      - ./llms.txt:/app/llms.txt:delegated
      - ./llms-full.txt:/app/llms-full.txt:delegated
      - ./data:/app/data:cached
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8321/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    secrets:
      - admin_api_key
      - resend_api_key
    command: uvicorn license_server.main:app --host 0.0.0.0 --port 8321 --reload
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  routellm_default:
    external: true

secrets:
  admin_api_key:
    file: ./secrets/admin_api_key.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
