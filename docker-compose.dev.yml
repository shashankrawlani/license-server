services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: license_server
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d license_server"]
      interval: 5s
      timeout: 5s
      retries: 5

  license-server:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=dev
      - RESEND_FROM_EMAIL=license-server@automationtester.in
      - BASE_URL=http://localhost:8001
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/license_server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./llms.txt:/app/llms.txt
      - ./llms-full.txt:/app/llms-full.txt
    secrets:
      - admin_api_key
      - resend_api_key
    command: uvicorn license_server.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped

secrets:
  admin_api_key:
    file: ./secrets/admin_api_key.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
